# Substitua o nome pelo projeto Pages existente e os IDs pelos namespaces criados.
name = "crf-al-prod"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-27"

[[kv_namespaces]]
binding = "NEWS_INDEX"
id = "REPLACE_WITH_PRODUCTION_NEWS_INDEX_ID"
preview_id = "REPLACE_WITH_PREVIEW_NEWS_INDEX_ID"

[[env.preview.kv_namespaces]]
binding = "NEWS_INDEX"
id = "REPLACE_WITH_PREVIEW_NEWS_INDEX_ID"
