<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/images/logo-crf-azul.png" />
    <link rel="apple-touch-icon" href="/images/logo-crf-azul.png" />

    <!-- WordPress (banners, notícias e eventos): antecipa a conexão -->
    <link rel="preconnect" href="https://wordpress.crf-al.org.br" />
    <link rel="preconnect" href="https://wordpress.crf-al.org.br" crossorigin />

    <!-- Pages Functions replace these fallbacks; React takes over on navigation. -->
    <title data-page-metadata="true">CRFAL - Conselho Regional de Farmácia do Estado de Alagoas</title>

    <!-- Open Graph base (fallback para scrapers que não executam JS) -->
    <meta data-page-metadata="true" property="og:type" content="website" />
    <meta data-page-metadata="true" property="og:locale" content="pt_BR" />
    <meta data-page-metadata="true" property="og:site_name" content="CRFAL - Conselho Regional de Farmácia do Estado de Alagoas" />
    <meta data-page-metadata="true" property="og:image" content="https://institucional.crf-al.org.br/images/og-image.jpg" />
    <meta data-page-metadata="true" property="og:image:type" content="image/jpeg" />
    <meta data-page-metadata="true" property="og:image:width" content="1200" />
    <meta data-page-metadata="true" property="og:image:height" content="630" />
    <meta data-page-metadata="true" property="og:image:alt" content="CRFAL — Conselho Regional de Farmácia de Alagoas. Valorizando a profissão. Protegendo a sociedade." />

    <!-- JSON-LD: Organização -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GovernmentOrganization",
      "name": "CRFAL - Conselho Regional de Farmácia do Estado de Alagoas",
      "alternateName": "CRFAL",
      "url": "https://institucional.crf-al.org.br",
      "logo": "https://institucional.crf-al.org.br/images/logo-crf-azul.png",
      "description": "Órgão de fiscalização do exercício da profissão farmacêutica no estado de Alagoas.",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "AL",
        "addressCountry": "BR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://institucional.crf-al.org.br/contato",
        "availableLanguage": "Portuguese"
      },
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
