<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/images/logo-crf-azul.png" />
    <link rel="apple-touch-icon" href="/images/logo-crf-azul.png" />

    <!-- Rawline (self-hospedada) — pesos críticos pré-carregados -->
    <link rel="preload" href="/fonts/rawline-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rawline-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rawline-700-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- WordPress (banners, notícias e eventos): antecipa a conexão -->
    <link rel="preconnect" href="https://wordpress.crf-al.org.br" />
    <link rel="preconnect" href="https://wordpress.crf-al.org.br" crossorigin />

    <!-- Banner fallback da home: pré-carregado para aparecer na primeira renderização -->
    <link rel="preload" href="/images/banners/banner4.jpg" as="image" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" href="/images/banners/banner4-mobile.jpg" as="image" media="(max-width: 767px)" fetchpriority="high" />

    <!--
      Apenas o <title> fica como fallback pré-render (a maioria dos scrapers sociais
      não executa JS). canonical, description e robots são definidos por página via
      react-helmet-async — não declarar aqui para não gerar tags duplicadas/conflitantes.
    -->
    <title>CRFAL - Conselho Regional de Farmácia do Estado de Alagoas</title>

    <!-- Open Graph base (fallback para scrapers que não executam JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="CRFAL - Conselho Regional de Farmácia do Estado de Alagoas" />
    <meta property="og:image" content="https://institucional.crf-al.org.br/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CRFAL — Conselho Regional de Farmácia de Alagoas. Valorizando a profissão. Protegendo a sociedade." />

    <!-- JSON-LD: Organização -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GovernmentOrganization",
      "name": "CRFAL - Conselho Regional de Farmácia do Estado de Alagoas",
      "alternateName": "CRFAL",
      "url": "https://institucional.crf-al.org.br",
      "logo": "https://institucional.crf-al.org.br/images/logo-crf-azul.png",
      "description": "Órgão de fiscalização do exercício da profissão farmacêutica no estado de Alagoas.",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "AL",
        "addressCountry": "BR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://institucional.crf-al.org.br/contato",
        "availableLanguage": "Portuguese"
      },
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
