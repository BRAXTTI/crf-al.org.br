<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Rawline é carregada pelos @font-face, conforme os pesos usados na página.
         Texto (400) e títulos (700) aparecem em todas as páginas: pré-carregados para
         evitar troca visível de fonte; os demais pesos seguem sob demanda. -->
    <link rel="preload" href="/fonts/rawline-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rawline-700-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/images/logo-crf-azul.png" />
    <link rel="apple-touch-icon" href="/images/logo-crf-azul.png" />

    <!-- WordPress (banners, notícias e eventos): antecipa a conexão -->
    <link rel="preconnect" href="https://wordpress.crf-al.org.br" />
    <link rel="preconnect" href="https://midias.crf-al.org.br" />

    <!-- Pages Functions replace these fallbacks; React takes over on navigation. -->
    <title data-page-metadata="true">Conselho Regional de Farmácia do Estado de Alagoas | CRFAL</title>

    <!-- Open Graph base (fallback para scrapers que não executam JS) -->
    <meta data-page-metadata="true" property="og:type" content="website" />
    <meta data-page-metadata="true" property="og:locale" content="pt_BR" />
    <meta data-page-metadata="true" property="og:site_name" content="CRFAL - Conselho Regional de Farmácia do Estado de Alagoas" />
    <meta data-page-metadata="true" property="og:image" content="%SITE_URL%/images/og-image.jpg" />
    <meta data-page-metadata="true" property="og:image:type" content="image/jpeg" />
    <meta data-page-metadata="true" property="og:image:width" content="1200" />
    <meta data-page-metadata="true" property="og:image:height" content="630" />
    <meta data-page-metadata="true" property="og:image:alt" content="CRFAL — Conselho Regional de Farmácia de Alagoas. Valorizando a profissão. Protegendo a sociedade." />

    <link rel="alternate" type="application/rss+xml" title="Notícias CRF-AL" href="/api/rss" />
    <!-- JSON-LD: Organização -->
    <script type="application/ld+json">%ORGANIZATION_JSON%</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
