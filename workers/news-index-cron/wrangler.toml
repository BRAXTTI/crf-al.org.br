name = "crf-al-news-index-cron"
main = "index.ts"
compatibility_date = "2026-10-27"
workers_dev = false
preview_urls = false

[triggers]
# Volume baixo (0–2 posts/dia): de 3 em 3 horas basta. Limiares que dependem deste intervalo:
# DURABLE_RENEW_MS, NEWS_INDEX_CHECK_REWRITE_MS e NEWS_INDEX_REFRESH_MS (functions/_news.ts).
crons = ["0 */3 * * *"]

[[kv_namespaces]]
binding = "NEWS_INDEX"
id = "196cd57ec1974cafb40efbb388cb0924"
