name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm run audit:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
